<svg width="680" height="524" viewBox="0 0 680 524" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Conductor オーケストレーション構成図</title>
<desc>縦方向のパイプライン図。タスク・文脈・モデル群・予算・履歴からなるタスクエンベロープが制御プレーンに入力される。制御プレーンには Gemma 4 E2B ベースの Conductor があり、ルート・実行計画・エスカレーション・確信度からなるルーティング決定を出力する。決定はデータプレーンの三層、フロンティア（1.0倍）、中間層（0.35倍）、ローカル層（無料）へ振り分けられる。層の間の破線矢印は上位層へのエスカレーションを表し、点線は実行結果が Conductor へ戻ることを示す。</desc>
<style>
  text { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Segoe UI", Helvetica, Arial, sans-serif; }
  .ts { font-size: 12px; font-weight: 400; fill: #59636e; }
  .th { font-size: 14px; font-weight: 500; fill: #1f2328; }
  .region { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 0.5; stroke-dasharray: 3 3; }
  .box   { fill: #ffffff; stroke: #d1d9e0; stroke-width: 0.5; }
  .amber { fill: #fff8c5; stroke: #d4a72c; stroke-width: 0.5; }
  .blue  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 0.5; }
  .arr { stroke: #59636e; stroke-width: 1.5; fill: none; }
  .esc { stroke: #59636e; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
  .fb  { stroke: #818b98; stroke-width: 1; fill: none; stroke-dasharray: 1 4; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #f0f6fc; }
    .ts { fill: #9198a1; }
    .region { fill: #0d1117; stroke: #3d444d; }
    .box { fill: #151b23; stroke: #3d444d; }
    .amber { fill: #3a2d12; stroke: #d4a72c; }
    .blue { fill: #121d2f; stroke: #316dca; }
    .arr, .esc { stroke: #9198a1; }
    .fb { stroke: #656c76; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="region" x="40" y="44" width="560" height="80" rx="4"/>
<text class="th" x="56" y="68">タスクエンベロープ</text>
<rect class="box" x="56" y="84" width="96" height="30" rx="4"/>
<text class="ts" x="104" y="103" text-anchor="middle">タスク</text>
<rect class="box" x="164" y="84" width="96" height="30" rx="4"/>
<text class="ts" x="212" y="103" text-anchor="middle">文脈</text>
<rect class="box" x="272" y="84" width="96" height="30" rx="4"/>
<text class="ts" x="320" y="103" text-anchor="middle">モデル群</text>
<rect class="box" x="380" y="84" width="96" height="30" rx="4"/>
<text class="ts" x="428" y="103" text-anchor="middle">予算</text>
<rect class="box" x="488" y="84" width="96" height="30" rx="4"/>
<text class="ts" x="536" y="103" text-anchor="middle">履歴</text>

<line class="arr" x1="320" y1="124" x2="320" y2="144" marker-end="url(#arrow)"/>

<rect class="region" x="40" y="150" width="560" height="158" rx="4"/>
<text class="th" x="56" y="174">制御プレーン</text>
<rect class="amber" x="180" y="184" width="280" height="56" rx="4"/>
<text class="th" x="320" y="208" text-anchor="middle">Conductor</text>
<text class="ts" x="320" y="228" text-anchor="middle">Gemma 4 E2B・4bit量子化</text>
<line class="arr" x1="320" y1="240" x2="320" y2="254" marker-end="url(#arrow)"/>
<rect class="box" x="140" y="258" width="360" height="36" rx="4"/>
<text class="ts" x="320" y="281" text-anchor="middle">ルート・実行計画・エスカレーション・確信度</text>

<rect class="region" x="40" y="336" width="560" height="134" rx="4"/>
<text class="th" x="56" y="360">データプレーン</text>
<rect class="blue" x="56" y="372" width="160" height="80" rx="4"/>
<text class="th" x="136" y="396" text-anchor="middle">フロンティア</text>
<text class="ts" x="136" y="416" text-anchor="middle">Claude・1.0倍</text>
<text class="ts" x="136" y="436" text-anchor="middle">高難度の推論</text>
<rect class="blue" x="240" y="372" width="160" height="80" rx="4"/>
<text class="th" x="320" y="396" text-anchor="middle">中間層</text>
<text class="ts" x="320" y="416" text-anchor="middle">ホスト型・0.35倍</text>
<text class="ts" x="320" y="436" text-anchor="middle">低リスクの実装</text>
<rect class="blue" x="424" y="372" width="160" height="80" rx="4"/>
<text class="th" x="504" y="396" text-anchor="middle">ローカル層</text>
<text class="ts" x="504" y="416" text-anchor="middle">端末内・無料</text>
<text class="ts" x="504" y="436" text-anchor="middle">抽出・分類</text>

<line class="arr" x1="320" y1="308" x2="146" y2="370" marker-end="url(#arrow)"/>
<line class="arr" x1="320" y1="308" x2="320" y2="370" marker-end="url(#arrow)"/>
<line class="arr" x1="320" y1="308" x2="494" y2="370" marker-end="url(#arrow)"/>

<line class="esc" x1="422" y1="412" x2="404" y2="412" marker-end="url(#arrow)"/>
<line class="esc" x1="238" y1="412" x2="220" y2="412" marker-end="url(#arrow)"/>

<path class="fb" d="M600 412 L620 412 L620 212 L466 212" marker-end="url(#arrow)"/>

<line class="arr" x1="40" y1="500" x2="70" y2="500"/>
<text class="ts" x="78" y="504">ルーティング決定</text>
<line class="esc" x1="200" y1="500" x2="230" y2="500"/>
<text class="ts" x="238" y="504">エスカレーション</text>
<line class="fb" x1="390" y1="500" x2="420" y2="500"/>
<text class="ts" x="428" y="504">実行結果のフィードバック</text>
</svg>
