<svg width="680" height="600" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Conductor project status, 2026-08-01</title>
<desc>Progress figure. Stage 0 is complete: a Gemma 4 E2B QLoRA adapter evaluated on 800 held-out envelopes with 100 percent schema, fleet and escalation-direction validity, 91.4 percent route agreement, and a 4 percent unsafe-downroute rate. Stages 1 through 3 are blocked because trace harvesting and deployment do not exist yet, so no real decision or outcome data has been collected. The critical path runs from trace harvesting through serving to outcome DPO.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t  { font-size: 13px; font-weight: 400; fill: #1f2328; }
  .ts { font-size: 11px; font-weight: 400; fill: #59636e; }
  .th { font-size: 14px; font-weight: 500; fill: #1f2328; }
  .big { font-size: 20px; font-weight: 500; fill: #1f2328; }
  .done  { fill: #dafbe1; stroke: #4ac26b; stroke-width: 0.5; }
  .prog  { fill: #fff8c5; stroke: #d4a72c; stroke-width: 0.5; }
  .todo  { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 0.5; }
  .panel { fill: none; stroke: #d1d9e0; stroke-width: 0.5; stroke-dasharray: 3 3; }
  .arr { stroke: #59636e; stroke-width: 1.5; fill: none; }
  .blk { stroke: #cf222e; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
  .ok { fill: #1a7f37; font-size: 13px; font-weight: 500; }
  .bad { fill: #cf222e; font-size: 13px; font-weight: 500; }
  @media (prefers-color-scheme: dark) {
    .t, .th, .big { fill: #f0f6fc; }
    .ts { fill: #9198a1; }
    .done { fill: #10301b; stroke: #2ea043; }
    .prog { fill: #3a2d12; stroke: #d4a72c; }
    .todo { fill: #151b23; stroke: #3d444d; }
    .panel { stroke: #3d444d; }
    .arr { stroke: #9198a1; }
    .blk { stroke: #f85149; }
    .ok { fill: #3fb950; }
    .bad { fill: #f85149; }
  }
</style>
